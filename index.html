<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b7a5c">
  <meta name="description" content="Hike Sathi — discover Nepal trails and find compatible hiking companions.">
  <title>Hike Sathi — Find Your Trail. Find Your Sathi.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="toast-root"></div>

  <header class="topbar">
    <a class="brand" href="#home" aria-label="Hike Sathi home">
      <span class="brand-mark">⛰</span>
      <span><strong>Hike Sathi</strong><small>Find your trail. Find your sathi.</small></span>
    </a>
    <nav id="main-nav" class="main-nav">
      <a href="#home" data-route="home">Home</a>
      <a href="#explore" data-route="explore">Explore</a>
      <a href="#groups" data-route="groups">Groups</a>
      <a href="#messages" data-route="messages">Messages</a>
      <a href="#profile" data-route="profile">Profile</a>
    </nav>
    <div class="top-actions">
      <button class="icon-btn" id="notification-btn" title="Notifications">🔔<span class="notif-dot"></span></button>
      <button class="avatar-btn" id="profile-shortcut">AS</button>
      <button class="mobile-menu" id="mobile-menu">☰</button>
    </div>
  </header>

  <main id="app"></main>

  <footer class="footer">
    <div>
      <div class="brand footer-brand"><span class="brand-mark">⛰</span><span><strong>Hike Sathi</strong><small>Explore Nepal together.</small></span></div>
      <p>Built as a lightweight, deployable HTML/CSS/JavaScript trekking companion platform.</p>
    </div>
    <div class="footer-links">
      <a href="#explore">Explore Trails</a>
      <a href="#groups">Find Groups</a>
      <a href="#preferences">Preferences</a>
      <a href="#profile">My Profile</a>
    </div>
  </footer>

  <div id="modal-root"></div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
